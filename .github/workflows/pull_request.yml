name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.19
    with:
      license_header_check_project_name: "SwiftServiceLifecycle"

  tests:
    name: Tests
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@d556757ad4b83683129d74b63ba4263a400492b3  # main, for https://github.com/swiftlang/github-workflows/pull/362
    with:
      linux_command: |
        Debug-Test: swift test
        Release-Build: swift build -c release
      linux_version_overrides: |
        default: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
        nightly-release: --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
        nightly-main: --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
      windows_version_overrides: |
        default: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
        nightly-release: --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
        nightly-main: --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
      windows_use_docker: true
      wasm_sdk_command: swift build --target ServiceLifecycle
      enable_macos: false
      enable_macos_swiftly: false
      enable_embedded_wasm_sdk_build: false
      enable_android_sdk_build: false
      enable_freebsd: false
